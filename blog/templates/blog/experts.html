{% extends 'blog/base.html' %}
{% block content %}
<h2><i class="fas fa-user-md"></i> Our Experts</h2>
<div class="expert-grid">
    {% for expert in experts %}
    <div class="expert-card" style="background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px;">
        <h4>{{ expert.name }}</h4>
        <p>{{ expert.title }}</p>
        <p>{{ expert.organization }}</p>
        <p>{{ expert.expertise }}</p>
        <a href="{% url 'contact-expert' expert.id %}" class="btn btn-success">Contact</a>
    </div>
    {% empty %}
    <p>No experts available.</p>
    {% endfor %}
</div>
{% endblock %}
