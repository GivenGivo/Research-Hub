{% extends 'blog/base.html' %}
{% block content %}
<h2><i class="fas fa-file-pdf"></i> Policy Documents</h2>
{% for policy in policies %}
    <div class="policy-card" style="background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px;">
        <h4>{{ policy.title }}</h4>
        <p>Type: {{ policy.document_type }}</p>
        <a href="{{ policy.file.url }}" download class="btn btn-primary">Download</a>
    </div>
{% empty %}
    <p>No policies available.</p>
{% endfor %}
{% endblock %}
